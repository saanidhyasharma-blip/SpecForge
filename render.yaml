services:
  - type: web
    runtime: node
    name: specforge-api
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    runtime: node
    name: specforge-web
    rootDir: frontend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_INTERNAL_URL
        fromService:
          name: specforge-api
          type: web
          property: hostport
